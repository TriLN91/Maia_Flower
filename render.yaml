# Render Blueprint — tạo toàn bộ hạ tầng từ repo: Dashboard > New > Blueprint > chọn repo này.
# Gói miễn phí: Static Site (web React, CDN, không ngủ) + web service (API + Celery)
# + Postgres + Key Value (Redis).
# Lưu ý gói miễn phí: API "ngủ" sau 15 phút không có truy cập (gọi lần đầu mất ~1 phút; web vẫn
# hiện ngay và báo "máy chủ đang khởi động");
# Postgres miễn phí hết hạn sau 30 ngày (tạo lại / nâng cấp khi cần).
# QUAN TRỌNG: cả 3 tài nguyên phải CÙNG region — địa chỉ nội bộ của database/Redis chỉ phân giải
# được trong cùng region (Render mặc định "oregon" nếu không ghi).

databases:
  - name: maia-db
    plan: free
    region: singapore
    databaseName: maia_flower
    user: maia

services:
  - type: keyvalue
    name: maia-redis
    plan: free
    region: singapore
    ipAllowList: [] # chỉ cho phép kết nối nội bộ trong Render
    maxmemoryPolicy: noeviction # dùng làm broker Celery + rate limit: không được tự xóa khóa

  - type: web
    name: maia-flower
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: maia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maia-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_PAY_SECRET
        generateValue: true
      # Bản demo công khai: seed dữ liệu lần đầu, tự nhập hàng mỗi sáng, bật cổng thanh toán giả lập
      - key: DEMO_MODE
        value: "true"
      - key: MOCK_GATEWAY_ENABLED
        value: "true"
      - key: RUN_WORKER_IN_WEB
        value: "true"
      # Web là Static Site riêng: CORS + trang kết quả thanh toán + "/" của API trỏ về đây.
      # Nếu Render đặt tên khác (trùng tên) -> sửa cả biến này lẫn VITE_API_BASE_URL bên dưới.
      - key: FRONTEND_URL
        value: https://maia-flower-web.onrender.com
      # Render đứng trước app như reverse proxy -> lấy IP thật từ X-Forwarded-For cho rate limit
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Mật khẩu tài khoản demo (owner@maiaflower.vn / tho@maiaflower.vn) — Render hỏi khi tạo
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
      # Tùy chọn: khóa Goong để gợi ý địa chỉ + quãng đường thực tế
      - key: GOONG_API_KEY
        sync: false

  # Web React (Vite) — Static Site miễn phí, phục vụ qua CDN, không "ngủ"
  - type: web
    name: maia-flower-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://maia-flower.onrender.com
    routes:
      # SPA: mọi đường dẫn của React Router (/mau/..., /admin/...) trả index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # File trong /assets có hash trong tên -> cache lâu dài
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
