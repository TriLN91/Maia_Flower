name: maia-flower

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maia_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-maia_flower}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maia} -d ${POSTGRES_DB:-maia_flower}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API chạy trong container (Linux) với code được mount vào -> sửa code là tự reload.
  #   docker compose up -d --build            # chạy API ở http://localhost:8000/docs
  #   docker compose exec api pytest          # chạy test
  api:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "1"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maia}:${POSTGRES_PASSWORD:-maia_dev_password}@postgres:5432/${POSTGRES_DB:-maia_flower}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maia}:${POSTGRES_PASSWORD:-maia_dev_password}@postgres:5432/maia_flower_test
      REDIS_URL: redis://redis:6379/0
      # Cổng thanh toán giả lập trả khách về trang kết quả của frontend
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-http://localhost:5173/payment-result}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - /app/.venv  # không để .venv của Windows lọt vào container
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Job nền (nhả đơn quá hạn mỗi phút, IPN trễ của cổng giả lập).
  # Dev chạy worker + beat chung một container; production nên tách và chỉ chạy MỘT beat.
  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "1"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maia}:${POSTGRES_PASSWORD:-maia_dev_password}@postgres:5432/${POSTGRES_DB:-maia_flower}
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app worker --beat --loglevel=info --concurrency=2 --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend (Vite dev server). Trên máy dev có thể chạy thẳng: npm --prefix frontend run dev
  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/web
      - /web/node_modules  # node_modules của Linux, tách khỏi bản Windows
    ports:
      - "5173:5173"
    depends_on:
      - api
    profiles: ["web"]

volumes:
  pgdata:
